<!DOCTYPE html>
<html lang="vi">
  <head>
    <script src="../js/events.js?v=7defa05f4547"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Quản lý cửa hàng · DTR</title>
    <style>
      *,*::before,*::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      :root {
        --bg: #0b0d12;
        --bg-2: #0e1118;
        --panel: #121620;
        --panel-2: #161b28;
        --fg: #e8e6e0;
        --fg-soft: #a8a8b3;
        --fg-mute: #6b7280;
        --lime: #c5ff3d;
        --red: #ff5f6d;
        --amber: #ffb03a;
        --green: #3ecf8e;
        --blue: #4fd1ff;
        --line: rgba(255,255,255,.08);
        --line-2: rgba(255,255,255,.14);
        --radius: 10px;
        --radius-lg: 14px;
        --sans: Inter,-apple-system,"Segoe UI",system-ui,sans-serif;
        --mono: "JetBrains Mono",ui-monospace,Consolas,monospace;
      }
      
      html,body {
        height: 100%;
      }
      
      body {
        overflow: hidden;
        font-family: var(--sans);
        font-size: 13.5px;
        line-height: 1.5;
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      
      a {
        text-decoration: none;
        color: inherit;
      }
      
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        cursor: pointer;
      }
      
      input,textarea,select {
        font: inherit;
        color: inherit;
      }
      
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      
      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,.1);
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,.2);
      }
      
      .app {
        display: grid;
        grid-template-columns: 260px 1fr;
        height: 100vh;
      }
      
      .sidebar {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg-2);
        border-right: 1px solid var(--line);
      }
      
      .sb-head {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }
      
      .sb-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      
      .sb-brand img {
        width: 36px;
        height: 36px;
        object-fit: cover;
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid var(--line-2);
      }
      
      .sb-brand-txt {
        flex: 1;
        min-width: 0;
      }
      
      .sb-brand-name {
        overflow: hidden;
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: #fff;
      }
      
      .sb-brand-tag {
        overflow: hidden;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: .14em;
        text-transform: uppercase;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--fg-mute);
      }
      
      .brand-picker {
        width: 100%;
        padding: 8px 10px;
        font-size: 12px;
        background: var(--panel);
        border: 1px solid var(--line-2);
        border-radius: 8px;
      }
      
      .brand-picker:focus {
        outline: none;
        border-color: var(--lime);
      }
      
      .sb-nav {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }
      
      .sb-group {
        padding: 14px 12px 6px;
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--fg-mute);
      }
      
      .sb-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        margin-bottom: 2px;
        font-size: 13px;
        border-radius: 8px;
        color: var(--fg-soft);
        cursor: pointer;
        transition: background .15s,color .15s;
      }
      
      .sb-item:hover {
        background: rgba(255,255,255,.04);
        color: var(--fg);
      }
      
      .sb-item.active {
        background: rgba(197,255,61,.1);
        color: var(--lime);
      }
      
      .sb-item.active .sb-icon {
        color: var(--lime);
      }
      
      .sb-item.soon {
        cursor: not-allowed;
        opacity: .55;
      }
      
      .sb-item.soon:hover {
        background: transparent;
        color: var(--fg-soft);
      }
      
      .sb-icon {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        font-size: 11px;
        color: var(--fg-mute);
      }
      
      .sb-label {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      
      .badge-soon {
        padding: 2px 6px;
        font-family: var(--mono);
        font-size: 8.5px;
        letter-spacing: .1em;
        text-transform: uppercase;
        border-radius: 100px;
        background: rgba(255,176,58,.12);
        color: var(--amber);
        border: 1px solid rgba(255,176,58,.3);
      }
      
      .sb-foot {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--line);
      }
      
      .file-status {
        padding: 6px 10px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: .1em;
        text-transform: uppercase;
        text-align: center;
        color: var(--fg-mute);
        border-radius: 6px;
        background: var(--panel);
        border: 1px solid var(--line);
      }
      
      .file-status.ok {
        color: var(--green);
        border-color: rgba(62,207,142,.3);
        background: rgba(62,207,142,.06);
      }
      
      .file-status.warn {
        color: var(--amber);
        border-color: rgba(255,176,58,.3);
        background: rgba(255,176,58,.06);
      }
      
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 14px;
        font-size: 12.5px;
        font-weight: 500;
        white-space: nowrap;
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid var(--line-2);
        color: var(--fg-soft);
        transition: background .15s,border-color .15s,color .15s;
      }
      
      .btn:hover {
        background: var(--panel-2);
        color: var(--fg);
        border-color: rgba(255,255,255,.2);
      }
      
      .btn-primary {
        font-weight: 600;
        background: var(--lime);
        color: #0b0d12;
        border-color: var(--lime);
      }
      
      .btn-primary:hover {
        background: #d4ff5c;
        border-color: #d4ff5c;
        color: #0b0d12;
      }
      
      .btn-block {
        width: 100%;
      }
      
      .btn-sm {
        padding: 5px 10px;
        font-size: 11.5px;
      }
      
      .btn-danger {
        border-color: rgba(255,95,109,.35);
        color: #ffb4b4;
      }
      
      .btn-danger:hover {
        background: rgba(255,95,109,.1);
        color: #ffb4b4;
        border-color: #ff5f6d;
      }
      
      .btn:disabled {
        opacity: .4;
        cursor: not-allowed;
      }
      
      .main {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
      }
      
      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
        background: var(--bg-2);
      }
      
      .topbar h1 {
        margin-bottom: 2px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -.01em;
        color: #fff;
      }
      
      .topbar .sub {
        font-size: 12px;
        color: var(--fg-mute);
      }
      
      .topbar-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      
      .tabs {
        display: flex;
        gap: 2px;
        padding: 0 24px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
        background: var(--bg-2);
      }
      
      .tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        font-size: 12.5px;
        white-space: nowrap;
        color: var(--fg-mute);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: color .15s,border-color .15s;
      }
      
      .tab:hover {
        color: var(--fg);
      }
      
      .tab.active {
        color: var(--lime);
        border-bottom-color: var(--lime);
      }
      
      .tab .t-icon {
        font-size: 11px;
        opacity: .7;
      }
      
      .editor {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
      }
      
      .editor-inner {
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-width: 1100px;
        margin: 0 auto;
      }
      
      .card {
        padding: 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
      }
      
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }
      
      .card-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -.01em;
        color: #fff;
      }
      
      .card-title .num {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: .14em;
        color: var(--fg-mute);
      }
      
      .card-sub {
        margin-top: 2px;
        font-size: 12px;
        color: var(--fg-mute);
      }
      
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 18px;
      }
      
      .field:last-child {
        margin-bottom: 0;
      }
      
      .field-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      
      .field-label > span:first-child {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--fg);
      }
      
      .field-label .hint {
        font-size: 11px;
        font-family: var(--mono);
        letter-spacing: .04em;
        color: var(--fg-mute);
      }
      
      .i18n-grid {
        display: grid;
        grid-template-columns: repeat(2,1fr);
        gap: 10px;
      }
      
      @media(min-width:1100px) {
        .i18n-grid {
          grid-template-columns: repeat(4,1fr);
        }
      }
      
      .i18n-cell {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      
      .i18n-cell .flag {
        display: flex;
        align-items: center;
        gap: 5px;
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: var(--fg-mute);
      }
      
      .i18n-cell .flag .f {
        font-size: 12px;
        line-height: 1;
      }
      
      .inp,.ta {
        width: 100%;
        padding: 9px 11px;
        font-size: 12.5px;
        font-family: var(--sans);
        background: var(--bg-2);
        border: 1px solid var(--line-2);
        border-radius: 8px;
        color: var(--fg);
        transition: border-color .15s,background .15s;
      }
      
      .inp:focus,.ta:focus {
        outline: none;
        border-color: var(--lime);
        background: rgba(197,255,61,.03);
      }
      
      .inp::placeholder,.ta::placeholder {
        color: var(--fg-mute);
      }
      
      .ta {
        min-height: 60px;
        line-height: 1.5;
        resize: vertical;
      }
      
      .inp.mono,.ta.mono {
        font-family: var(--mono);
        font-size: 11.5px;
        letter-spacing: .02em;
      }
      
      .media-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill,minmax(260px,1fr));
        gap: 14px;
      }
      
      .media-item {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        background: var(--bg-2);
        border: 1px solid var(--line-2);
        border-radius: 10px;
      }
      
      .media-item.hidden-item {
        opacity: .5;
      }
      
      .media-thumb {
        display: grid;
        place-items: center;
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        overflow: hidden;
        background: rgba(0,0,0,.4);
        border-radius: 6px;
        border: 1px solid var(--line);
      }
      
      .media-thumb img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      
      .media-thumb .placeholder {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: .1em;
        color: var(--fg-mute);
      }
      
      .media-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      
      .media-name {
        font-size: 12px;
        font-weight: 500;
        color: var(--fg);
      }
      
      .media-url {
        font-family: var(--mono);
        font-size: 10.5px;
      }
      
      .switch {
        position: relative;
        display: inline-block;
        flex-shrink: 0;
        width: 34px;
        height: 20px;
      }
      
      .switch input {
        width: 0;
        height: 0;
        opacity: 0;
      }
      
      .switch .slider {
        position: absolute;
        inset: 0;
        cursor: pointer;
        background: rgba(255,255,255,.1);
        border-radius: 20px;
        transition: .2s;
      }
      
      .switch .slider::before {
        position: absolute;
        left: 3px;
        bottom: 3px;
        height: 14px;
        width: 14px;
        content: '';
        background: #fff;
        border-radius: 50%;
        transition: .2s;
      }
      
      .switch input:checked + .slider {
        background: var(--lime);
      }
      
      .switch input:checked + .slider::before {
        background: #0b0d12;
        transform: translateX(14px);
      }
      
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        margin-bottom: 8px;
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      
      .toggle-row:last-child {
        margin-bottom: 0;
      }
      
      .toggle-row-txt {
        flex: 1;
        min-width: 0;
      }
      
      .toggle-row-name {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--fg);
      }
      
      .toggle-row-desc {
        margin-top: 2px;
        font-size: 11px;
        color: var(--fg-mute);
      }
      
      .link-field {
        display: flex;
        gap: 8px;
      }
      
      .link-field .inp {
        flex: 1;
      }
      
      .coming-soon {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 60vh;
        text-align: center;
        color: var(--fg-soft);
      }
      
      .cs-icon {
        font-size: 48px;
        opacity: .6;
      }
      
      .coming-soon h2 {
        font-size: 20px;
        font-weight: 600;
        color: #fff;
      }
      
      .coming-soon p {
        max-width: 420px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--fg-mute);
      }
      
      .toast-wrap {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      
      .toast {
        padding: 10px 16px;
        min-width: 200px;
        font-size: 12.5px;
        background: var(--panel-2);
        border: 1px solid var(--line-2);
        border-radius: 8px;
        color: var(--fg);
        box-shadow: 0 10px 30px rgba(0,0,0,.5);
        pointer-events: auto;
        animation: toastIn .25s cubic-bezier(.2,.8,.2,1);
      }
      
      .toast.ok {
        border-color: rgba(62,207,142,.4);
        color: #c4f5dd;
      }
      
      .toast.warn {
        border-color: rgba(255,176,58,.4);
        color: #ffd998;
      }
      
      .toast.err {
        border-color: rgba(255,95,109,.4);
        color: #ffc4c8;
      }
      
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
      
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 60vh;
        text-align: center;
        color: var(--fg-mute);
      }
      
      .empty-state .ico {
        font-size: 44px;
        opacity: .5;
      }
      
      .empty-state h2 {
        font-size: 16px;
        font-weight: 500;
        color: var(--fg);
      }
      
      @media(max-width:860px) {
        .app {
          display: flex;
          flex-direction: column;
          width: 100%;
          min-width: 0;
        }
      
        .sidebar {
          display: flex;
          flex-direction: column;
          flex-shrink: 0;
          max-height: 190px;
        }
      
        .sb-head {
          flex-direction: row;
          align-items: center;
          padding: 8px 12px;
        }
      
        .sb-brand {
          min-width: 140px;
        }
      
        .brand-picker {
          max-width: 210px;
        }
      
        .sb-nav {
          display: flex;
          flex-shrink: 0;
          overflow-x: auto;
          padding: 4px 8px;
        }
      
        .sb-group {
          display: none;
        }
      
        .sb-foot {
          display: flex;
          flex-direction: row;
          padding: 4px 8px;
          border: 0;
        }
      
        .sb-foot .file-status,.sb-foot #btnSwapBrands,.sb-foot #btnRestoreAll {
          display: none;
        }
      
        .sb-foot #btnPick {
          width: auto;
        }
      
        .sb-item {
          margin: 0 2px;
          white-space: nowrap;
        }
      
        .main {
          flex: 1;
          min-height: 0;
          min-width: 0;
          width: 100%;
        }
      
        .topbar {
          flex-wrap: wrap;
          padding: 10px 12px;
        }
      
        .topbar-actions {
          justify-content: flex-start;
          flex-wrap: nowrap;
          width: 100%;
          overflow-x: auto;
        }
      
        .editor {
          padding: 12px;
          min-width: 0;
        }
      
        .editor-inner,.card {
          min-width: 0;
        }
      
        .i18n-grid {
          grid-template-columns: minmax(0,1fr);
        }
      
        .editor .toggle-row {
          flex-wrap: wrap;
        }
      
        .editor .toggle-row .field {
          flex: 1 1 170px;
          min-width: 0;
          margin-bottom: 0;
        }
      }
    </style>

  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sb-head">
          <div class="sb-brand">
            <img id="sbLogo" src="data:," alt="">
            <div class="sb-brand-txt">
              <div class="sb-brand-name" id="sbName">Cửa hàng</div>
              <div class="sb-brand-tag" id="sbTag">Quản lý</div>
            </div>
          </div>
          <select class="brand-picker" id="brandPicker"></select>
        </div>
        <nav class="sb-nav" id="sbNav">
          <div class="sb-group">Cửa hàng</div>
          <a class="sb-item" data-view="shop"><span class="sb-icon">◫</span><span class="sb-label">Quản lý cửa hàng</span></a>
          <a class="sb-item" data-view="products"><span class="sb-icon">▤</span><span class="sb-label">Sản phẩm</span></a>
          <a class="sb-item" data-view="orders"><span class="sb-icon">▦</span><span class="sb-label">Đơn hàng</span></a>
          <a class="sb-item" data-view="customers"><span class="sb-icon">◐</span><span class="sb-label">Khách hàng</span></a>
          <div class="sb-group">Giao diện</div>
          <a class="sb-item active" data-view="landing"><span class="sb-icon">◆</span><span class="sb-label">Trang giới thiệu</span></a>
          <a class="sb-item" data-view="theme"><span class="sb-icon">◑</span><span class="sb-label">Màu sắc</span></a>
          <a class="sb-item" data-view="pages"><span class="sb-icon">▣</span><span class="sb-label">Các trang cửa hàng</span></a>
          <div class="sb-group">Hệ thống</div>
          <a class="sb-item soon" data-view="analytics"><span class="sb-icon">◈</span><span class="sb-label">Phân tích</span><span class="badge-soon">Chưa có</span></a>
          <a class="sb-item soon" data-view="settings"><span class="sb-icon">⚙</span><span class="sb-label">Cài đặt</span><span class="badge-soon">Chưa có</span></a>

            return;
          }
          const choice = prompt(`Chọn cặp brand để hoán đổi:\n` + state.brands.map((x, i) => `${i + 1}. ${x.id} (${x.label})`).join('\n') + `\n\nNhập "1 2" để hoán đổi brand-1 ↔ brand-2, hoặc "1 3", "2 3"…`, `1 2`);
          if (!choice) return;
          const m = choice.trim().split(/\s+/).map(Number);
          if (m.length !== 2 || m.some(n => !n || n < 1 || n > state.brands.length)) {
            toast('Cú pháp không hợp lệ', 'err');
            return;
          }
          const A = state.brands[m[0] - 1];
          const B = state.brands[m[1] - 1];
          if (A.id === B.id) {
            toast('Cần 2 brand khác nhau', 'err');
            return;
          }
          if (!confirm(`Hoán đổi nội dung:\n"${A.id}" ⇄ "${B.id}"?\n\nFile JSON của cả 2 brand sẽ bị ghi đè.`)) return;
          try {
            const dictsA = {},
              dictsB = {};
            for (const l of LANGS) {
              dictsA[l] = await readJSON(A.path + '/' + l + '.json');
              dictsB[l] = await readJSON(B.path + '/' + l + '.json');
            }
            for (const l of LANGS) {
              await writeText(A.path + '/' + l + '.json', pretty(dictsB[l]));
              await writeText(B.path + '/' + l + '.json', pretty(dictsA[l]));
            }
            try {
              const metaA = await readJSON(A.path + '/meta.json');
              const metaB = await readJSON(B.path + '/meta.json');
              await writeText(A.path + '/meta.json', pretty(metaB));
              await writeText(B.path + '/meta.json', pretty(metaA));
            } catch (e) {}
            toast(`Đã hoán đổi ${A.id} ⇄ ${B.id}`, 'ok');
            await loadBrand(state.current.id);
          } catch (e) {
            toast('Lỗi hoán đổi: ' + e.message, 'err');
          }
        }
        function renderThemeEditor() {
          $('btnSave').hidden = false;
          $('tabs').style.display = 'none';
          $('viewTitle').textContent = 'Màu sắc & Nhận diện';
          $('viewSub').textContent = 'Chỉnh sửa bảng màu giao diện và Logo cho toàn bộ hệ thống';
          state.meta = state.meta || {};
          state.meta.theme = state.meta.theme || {
            "--lime": "#c5ff3d",
            "--lime-rgb": "197,255,61",
            "--cream": "#fff9cb",
            "--pink": "#ffb0c4",
            "--bg": "#0b0d12",
            "--bg-2": "#11141b"
          };
          state.meta.media = state.meta.media || {};
          const editor = $('editor');
          editor.innerHTML = `
            <div style="max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:20px;">
              <div class="card" style="padding:20px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;">
                <h3 style="margin-top:0;margin-bottom:12px;font-size:15px;color:var(--lime);">Bảng màu thương hiệu (Theme Colors)</h3>
                <p style="font-size:12px;color:var(--fg-soft);margin-bottom:16px;">Các màu sắc này sẽ được áp dụng cho trang giới thiệu và toàn bộ cửa hàng Marketplace.</p>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;">
                  <div>
                    <label style="display:block;font-size:12px;margin-bottom:6px;">Màu chủ đạo (--lime)</label>
                    <div style="display:flex;gap:8px;align-items:center;">
                      <input type="color" id="thm_lime_pick" value="${state.meta.theme['--lime'] || '#c5ff3d'}" style="width:36px;height:36px;border:none;border-radius:6px;cursor:pointer;">
                      <input type="text" id="thm_lime" value="${state.meta.theme['--lime'] || '#c5ff3d'}" class="input" style="flex:1;">
                    </div>
                  </div>
                  <div>
                    <label style="display:block;font-size:12px;margin-bottom:6px;">Màu nền chính (--bg)</label>
                    <div style="display:flex;gap:8px;align-items:center;">
                      <input type="color" id="thm_bg_pick" value="${state.meta.theme['--bg'] || '#0b0d12'}" style="width:36px;height:36px;border:none;border-radius:6px;cursor:pointer;">
                      <input type="text" id="thm_bg" value="${state.meta.theme['--bg'] || '#0b0d12'}" class="input" style="flex:1;">
                    </div>
                  </div>
                  <div>
                    <label style="display:block;font-size:12px;margin-bottom:6px;">Màu nền thẻ (--bg-2)</label>
                    <div style="display:flex;gap:8px;align-items:center;">
                      <input type="color" id="thm_bg2_pick" value="${state.meta.theme['--bg-2'] || '#11141b'}" style="width:36px;height:36px;border:none;border-radius:6px;cursor:pointer;">
                      <input type="text" id="thm_bg2" value="${state.meta.theme['--bg-2'] || '#11141b'}" class="input" style="flex:1;">
                    </div>
                  </div>
                  <div>
                    <label style="display:block;font-size:12px;margin-bottom:6px;">Màu kem (--cream)</label>
                    <div style="display:flex;gap:8px;align-items:center;">
                      <input type="color" id="thm_cream_pick" value="${state.meta.theme['--cream'] || '#fff9cb'}" style="width:36px;height:36px;border:none;border-radius:6px;cursor:pointer;">
                      <input type="text" id="thm_cream" value="${state.meta.theme['--cream'] || '#fff9cb'}" class="input" style="flex:1;">
                    </div>
                  </div>
                  <div>
                    <label style="display:block;font-size:12px;margin-bottom:6px;">Màu hồng (--pink)</label>
                    <div style="display:flex;gap:8px;align-items:center;">
                      <input type="color" id="thm_pink_pick" value="${state.meta.theme['--pink'] || '#ffb0c4'}" style="width:36px;height:36px;border:none;border-radius:6px;cursor:pointer;">
                      <input type="text" id="thm_pink" value="${state.meta.theme['--pink'] || '#ffb0c4'}" class="input" style="flex:1;">
                    </div>
                  </div>
                </div>
              </div>
              <div class="card" style="padding:20px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;">
                <h3 style="margin-top:0;margin-bottom:12px;font-size:15px;color:var(--lime);">Logo Thương Hiệu</h3>
                <div>
                  <label style="display:block;font-size:12px;margin-bottom:6px;">URL Logo chính</label>
                  <input type="url" id="thm_logo" value="${state.meta.media.logo || ''}" class="input" style="width:100%;margin-bottom:10px;">
                  <div style="padding:10px;background:rgba(0,0,0,0.3);border-radius:8px;display:inline-block;">
                    <img id="thm_logo_preview" src="${state.meta.media.logo || ''}" style="max-height:48px;max-width:200px;object-fit:contain;" onerror="this.style.display='none'">
                  </div>
                </div>
              </div>
            </div>
          `;
          function bindSync(pickId, textId, prop) {
            const pick = $(pickId);
            const text = $(textId);
            if (!pick || !text) return;
            pick.addEventListener('input', () => {
              text.value = pick.value;
              state.meta.theme[prop] = pick.value;
              state.dirty = true;
            });
            text.addEventListener('input', () => {
              pick.value = text.value;
              state.meta.theme[prop] = text.value;
              state.dirty = true;
            });
          }
          bindSync('thm_lime_pick', 'thm_lime', '--lime');
          bindSync('thm_bg_pick', 'thm_bg', '--bg');
          bindSync('thm_bg2_pick', 'thm_bg2', '--bg-2');
          bindSync('thm_cream_pick', 'thm_cream', '--cream');
          bindSync('thm_pink_pick', 'thm_pink', '--pink');
          const logoInp = $('thm_logo');
          const logoPrev = $('thm_logo_preview');
          if (logoInp) {
            logoInp.addEventListener('input', () => {
              state.meta.media.logo = logoInp.value;
              if (logoPrev) {
                logoPrev.src = logoInp.value;
                logoPrev.style.display = 'block';
              }
              state.dirty = true;
            });
          }
        }
        function initNav() {
          document.querySelectorAll('.sb-item').forEach(item => {
            item.addEventListener('click', () => {
              if (item.classList.contains('soon')) {
                $('viewTitle').textContent = item.querySelector('.sb-label').textContent;
                $('viewSub').textContent = 'Chưa có thiết lập cho mục này';
                const editor = $('editor');
                editor.innerHTML = `<div class="coming-soon">
          <div class="cs-icon">🚧</div>
          <h2>Tính năng đang phát triển</h2>
          <p>Module "${item.querySelector('.sb-label').textContent}" sẽ có trong phiên bản tiếp theo.</p>
        </div>`;
                $('tabs').style.display = 'none';
                document.querySelectorAll('.sb-item').forEach(x => x.classList.remove('active'));
                item.classList.add('active');
                return;
              }
              if (state.currentView === 'landing') collectFormIntoState();
              const view = item.dataset.view;
              state.currentView = view;
              document.querySelectorAll('.sb-item').forEach(x => x.classList.remove('active'));
              item.classList.add('active');
              if (view === 'landing') {
                $('btnSave').hidden = false;
                $('tabs').style.display = 'flex';
                $('viewTitle').textContent = 'Trang giới thiệu';
                $('viewSub').textContent = 'Chỉnh sửa nội dung, hình ảnh và liên kết';
                renderTabs();
                renderEditor();
              } else if (view === 'theme') {
                renderThemeEditor();
              } else if (window.DTRAdminExtension) {
                $('tabs').style.display = 'none';
                window.DTRAdminExtension.render(view);
              }
            });
          });
        }
        async function pickRoot() {
          if (!FSA_OK) {
            $('fileStatus').textContent = 'Chỉ đọc (tải xuống)';
            $('fileStatus').className = 'file-status warn';
            toast('Trình duyệt không hỗ trợ ghi thư mục', 'warn');
            return;
          }
          try {
            const chosen = await window.showDirectoryPicker({
              mode: 'readwrite'
            });
            await chosen.getDirectoryHandle('about');
            await chosen.getDirectoryHandle('data');
            await chosen.getFileHandle('marketplace.html');
            state.root = chosen;
            $('fileStatus').textContent = '' + state.root.name;
            $('fileStatus').className = 'file-status ok';
            await loadBrands();
            if (window.DTRAdminExtension) await window.DTRAdminExtension.reload();
            if (state.brands[0]) {
              $('brandPicker').value = state.brands[0].id;
              await loadBrand(state.brands[0].id);
              $('btnRestoreAll').disabled = false;
            }
          } catch (e) {
            if (e.name !== 'AbortError') toast('Hãy chọn thư mục shop1: ' + e.message, 'err');
          }
        }
        async function boot() {
          initNav();
          $('editor').addEventListener('input', event => {
            const input = event.target;
            if (state.currentView !== 'landing' || !input.matches('[data-key][data-lang]')) return;
            if (!LANGS.includes(input.dataset.lang)) return;
            setDeep(state[input.dataset.lang], input.dataset.key, input.value);
            state.dirty = true;
          });
          $('btnPick').addEventListener('click', pickRoot);
          $('btnSave').addEventListener('click', saveAll);
          $('btnReload').addEventListener('click', () => {
            if (state.currentView === 'landing') {
              if (state.current) loadBrand(state.current.id);
            } else if (window.DTRAdminExtension) window.DTRAdminExtension.reload();
          });
          $('btnSwapBrands').addEventListener('click', swapBrands);
          $('btnRestoreAll').addEventListener('click', restoreAll);
          $('btnRestoreOne').addEventListener('click', () => state.current && restoreBrand(state.current.id));
          $('brandPicker').addEventListener('change', e => loadBrand(e.target.value));
          $('brandPicker').disabled = true;
          window.addEventListener('beforeunload', e => {
            window.DTRAdminExtension?.flushDraft();
            if (state.dirty || window.DTRAdminExtension?.hasUnsavedChanges()) {
              e.preventDefault();
              e.returnValue = '';
            }
          });
          if (location.protocol.startsWith('http')) {
            $('fileStatus').textContent = 'Chưa cấp quyền ghi — bấm Chọn thư mục';
            $('fileStatus').className = 'file-status warn';
            await loadBrands();
            if (state.brands[0]) {
              $('brandPicker').value = state.brands[0].id;
              await loadBrand(state.brands[0].id);
              $('btnRestoreAll').disabled = false;
            }
          }
        }
        document.addEventListener('DOMContentLoaded', boot);
        window.DTRManager = {
          state,
          readJSON,
          writeText,
          pretty,
          toast,
          renderEditor
        };
      })();
    </script>
  </body>
</html>
