<style>
:root{color-scheme:dark;--bg:#0d1014;--card:#141920;--ink:#e8ecf1;--mute:#8a95a3;--line:#232a33;--acc:#f0b03a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Noto Sans JP","Noto Sans KR",Roboto,sans-serif;font-size:14px;line-height:1.4}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:#10141a}
.logo{font-weight:700;font-size:1rem}.live{color:#e5484d;font-weight:600;font-size:.8rem}.live i{color:var(--mute);font-style:normal;font-weight:400}.sp{flex:1}
button,select{font:inherit;color:var(--ink);background:#1b222b;border:1px solid #2c3641;border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{background:#232c37}button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tg.on{background:var(--acc);color:#16110a;border-color:var(--acc);font-weight:600}
.seg{display:inline-flex;border:1px solid #2c3641;border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0;padding:6px 10px}.seg button.on{background:#34404e;color:#fff;font-weight:600}
.main{display:grid;grid-template-columns:1fr 360px;gap:12px;padding:12px;max-width:1560px;margin:0 auto}
@media(max-width:920px){.main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.sec{padding:7px 12px;font-size:.8rem;font-weight:600;color:var(--mute);border-bottom:1px solid var(--line)}
.gl{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#05070a}
#g{display:block;width:100%;height:auto;aspect-ratio:2/1;min-height:320px;touch-action:none;cursor:grab}
#nb{position:absolute;left:0;right:0;top:0;height:30px;display:flex;align-items:center;gap:10px;background:rgba(10,12,16,.92);border-bottom:1px solid #2c3641;z-index:4;overflow:hidden}
.bn{background:#1f6fd1;color:#fff;font-weight:800;font-size:.74rem;letter-spacing:.06em;padding:0 12px;height:100%;display:flex;align-items:center;flex:none}
.tk{flex:1;overflow:hidden;height:100%;display:flex;align-items:center}#tr{display:flex;white-space:nowrap;will-change:transform}.ti{font-size:.8rem;font-weight:500;padding-right:56px;flex:none}
#nu{flex:none;color:var(--mute);font-style:normal;font-size:.75rem;padding-right:12px}
#tip{position:absolute;right:10px;bottom:12px;background:rgba(14,17,22,.95);border:1px solid #333f4d;padding:5px 10px;border-radius:8px;font-size:.84rem;display:none}
.zb{position:absolute;right:10px;top:40px;display:flex;flex-direction:column;gap:4px}.zb button{min-width:38px;padding:4px 6px}
.ph{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.ph b{font-size:1.05rem}.ph span{color:var(--mute);font-size:.85rem;flex:1;text-align:right}
#liv svg{display:block;width:100%;height:auto}
.rt{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:6px}.rt div{text-align:center;flex:1}.rt strong{font-size:1.7rem;display:block;line-height:1}.rt small{display:block;color:var(--mute)}.rt i{font-style:normal;font-size:1.3rem;color:var(--acc)}
.pb{height:4px;background:var(--line);margin:0 12px 10px;border-radius:3px;overflow:hidden}.pb i{display:block;height:100%;background:var(--acc);width:0}
.kv{padding:8px 12px}.kv div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;align-items:center}.kv small{color:var(--mute)}.kv span{font-weight:600;text-align:right}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;color:#11151a}
.ai{padding:0 12px 10px;color:var(--mute);font-size:.8rem}.ai b{color:#9fc4e8}
.mini{padding:2px 8px;font-size:.78rem}
.fg{width:18px;height:12px;vertical-align:-1px;margin-right:4px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.pk{padding:10px 12px}.pk p{margin:0 0 8px;color:#cfd6df}.pk button{display:block;width:100%;text-align:left;margin-bottom:8px;padding:9px 11px}.pk small{display:block;color:var(--mute);font-weight:400}
.note{color:var(--mute);font-size:.78rem;padding:2px 4px 10px}
#pkc{position:absolute;left:10px;bottom:10px;width:min(330px,calc(100% - 20px));z-index:5;margin:0;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#tm{font:inherit;color:var(--ink);background:#1b222b;border:1px solid #2c3641;border-radius:8px;padding:5px 8px;color-scheme:dark}
.main.np{grid-template-columns:1fr}.main.np aside{display:none}

.zb button{border-radius:12px}
