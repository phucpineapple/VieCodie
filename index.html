<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whiteboard Landing Page · Creative Workspace</title>
  
  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Satoshi:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- MAIN STYLES -->
  <link rel="stylesheet" href="./css/main.css">

  <!-- Import Maps cho Three.js -->
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>

  <!-- LOADER -->
  <div class="loader" id="loader">
    <div class="loader-mark"><span>W</span></div>
    <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
    <div class="loader-text">Đang chuẩn bị bảng vẽ... <span class="pct" id="loaderPct">0%</span></div>
  </div>

  <!-- CURSOR -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <!-- BACKGROUND EFFECTS -->
  <canvas id="particles"></canvas>
  <div class="bg-glow" id="bgGlow"></div>
  <div class="bg-grid"></div>

  <!-- NAVIGATION -->
  <nav class="nav" id="nav">
    <a href="#" class="brand"><span class="logo">W</span>WhiteBoard</a>
    <div class="links">
      <a href="#platform">Tính năng</a>
      <a href="#globe">Mạng lưới</a>
      <a href="#journey">Lộ trình</a>
      <a href="#mission">Sứ mệnh</a>
      <a href="#support">Hỗ trợ</a>
    </div>
    <a href="#cta" class="cta" data-magnetic>Dùng thử miễn phí →</a>
  </nav>

  <!-- APP CONTAINER -->
  <main id="app"></main>

  <!-- CONFIG & SCRIPTS -->
  <script src="./js/config.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
